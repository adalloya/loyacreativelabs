name: Build Loya Scope Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-scope/**'
      - '.github/workflows/build-scope-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Loya Scope APK (Release signed with debug key)
        working-directory: ./android-scope
        run: gradle assembleRelease --no-daemon

      - name: Copy APK to public/loya-scope.apk
        run: |
          cp android-scope/app/build/outputs/apk/release/app-release.apk public/loya-scope.apk
          ls -lh public/loya-scope.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: loya-scope-apk
          path: public/loya-scope.apk

      - name: Commit & Push public/loya-scope.apk to repository
        run: |
          git config --local user.email "actions@loyacreativelab.com"
          git config --local user.name "Loya Creative Lab CI"
          git add -f public/loya-scope.apk
          git diff --staged --quiet || (git commit -m "chore(scope): update compiled Android USB-C APK [skip ci]" && git pull --rebase origin main && git push origin main)
