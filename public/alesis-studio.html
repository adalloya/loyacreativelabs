    <script>
        // --- CREDENCIALES DE SUPABASE (LOYA CREATIVE LAB) ---
        const SUPABASE_URL = 'https://femjbpqeejfymdkuagti.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlbWpicHFlZWpmeW1ka3VhZ3RpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MzM1ODMsImV4cCI6MjEwODEwOTU4M30.WoilJ87pAP8HH4CeojXI8eYbkXGXvDLF1n6ZvdjpiSk';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const NOTE_LABELS = {
            48:'C3',49:'C#3',50:'D3',51:'D#3',52:'E3',53:'F3',54:'F#3',55:'G3',56:'G#3',57:'A3',58:'A#3',59:'B3',
            60:'C4',61:'C#4',62:'D4',63:'D#4',64:'E4',65:'F4',66:'F#4',67:'G4',68:'G#4',69:'A4',70:'A#4',71:'B4',
            72:'C5',73:'C#5',74:'D5',75:'D#5',76:'E5'
        };
        const SOLFEGE_LABELS = {
            48:'Do3',49:'Do#3',50:'Re3',51:'Re#3',52:'Mi3',53:'Fa3',54:'Fa#3',55:'Sol3',56:'Sol#3',57:'La3',58:'La#3',59:'Si3',
            60:'Do4',61:'Do#4',62:'Re4',63:'Re#4',64:'Mi4',65:'Fa4',66:'Fa#4',67:'Sol4',68:'Sol#4',69:'La4',70:'La#4',71:'Si4',
            72:'Do5',73:'Do#5',74:'Re5',75:'Re#5',76:'Mi5'
        };

        let midiOutputs = [];
        let sysexEnabled = false;
        let litHardwareNotes = new Map();
        let hardwareLedState = new Map();
        let ledTimers = new Map();
        let osmd = null;
        let isForcedHorizontal = false;
        let audioCtx = null;

        /**
         * PROTOCOLO OFICIAL ALESIS TEACHER'S CHOICE 61 (Extraído de Skoove APK: AlesisMidiLEDController.kt)
         * Manufacturer ID: [0x00, 0x00, 0x0E] (Alesis)
         * Product Model ID: [0x00, 0x4D] (Teacher's Choice 61)
         * MessageTypeIdentifier: SET_LED = 0x00, RESET_ALL = 0x04
         * LedColors: OFF = 0x00 (0), RED = 0x01 (1), GREEN = 0x09 (9), AMBER = 0x17 (23)
         */
        const ALESIS_TC61_SYSEX_HEADER = [0xF0, 0x00, 0x00, 0x0E, 0x00, 0x4D];
        const ALESIS_CMD_SET_LED = 0x00;
        const ALESIS_CMD_RESET_ALL = 0x04;
        const ALESIS_COLOR_OFF = 0x00;
        const ALESIS_COLOR_RED = 0x01;
        const ALESIS_COLOR_GREEN = 0x09;
        const ALESIS_COLOR_AMBER = 0x17;

        let sysexQueue = [];
        let sysexQueueTimer = null;
        let lastSysexSentAt = 0;
        let wasMidiConnected = false;
        let skipAutoSyncOnce = false;

        function resetAllHardwareLeds() {
            if (sysexQueueTimer) {
                clearTimeout(sysexQueueTimer);
                sysexQueueTimer = null;
            }
            sysexQueue = [];
            ledTimers.forEach(t => clearTimeout(t));
            ledTimers.clear();
            hardwareLedState.clear();
            if (!midiOutputs.length) return;
            for (let out of midiOutputs) {
                try {
                    out.send([...ALESIS_TC61_SYSEX_HEADER, ALESIS_CMD_RESET_ALL, 0xF7]);
                } catch {}
            }
            lastSysexSentAt = Date.now();
            litHardwareNotes.clear();
        }

        function transmitRawLedPacket(noteNumber, color) {
            if (!midiOutputs.length) return;
            const colorByte =
                color === 'orange' ? ALESIS_COLOR_AMBER :
                color === 'green' ? ALESIS_COLOR_GREEN :
                color === 'red' ? ALESIS_COLOR_RED :
                ALESIS_COLOR_OFF;
            const sysexPacket = [
                ...ALESIS_TC61_SYSEX_HEADER,
                ALESIS_CMD_SET_LED,
                noteNumber & 0x7F,
                colorByte,
                0xF7
            ];
            let sentSysex = false;
            for (let out of midiOutputs) {
                try {
                    out.send(sysexPacket);
                    sentSysex = true;
                } catch {}
            }
            lastSysexSentAt = Date.now();
            if (!sentSysex) {
                for (let out of midiOutputs) {
                    try {
                        if (!color || color === 'green') {
                            out.send([0x80, noteNumber, 0]);
                            out.send([0x90, noteNumber, 0]);
                        } else {
                            out.send([0x90, noteNumber, 1]);
                        }
                    } catch {}
                }
            }
            if (color) {
                litHardwareNotes.set(noteNumber, 1);
            } else {
                litHardwareNotes.delete(noteNumber);
            }
        }

        function flushSysexQueue() {
            sysexQueueTimer = null;
            if (!sysexQueue.length) return;
            const nextItem = sysexQueue.shift();
            transmitRawLedPacket(nextItem.noteNumber, nextItem.color);
            if (sysexQueue.length > 0) {
                sysexQueueTimer = setTimeout(flushSysexQueue, 38);
            }
        }

        function sendHardwareMidi(noteNumber, color) {
            if (!color) {
                hardwareLedState.delete(noteNumber);
            } else {
                hardwareLedState.set(noteNumber, color);
            }
            if (!midiOutputs.length) return;

            const now = Date.now();
            const elapsed = now - lastSysexSentAt;
            if (sysexQueue.length === 0 && !sysexQueueTimer && elapsed >= 38) {
                transmitRawLedPacket(noteNumber, color);
                return;
            }
            const existingIdx = sysexQueue.findIndex(item => item.noteNumber === noteNumber);
            if (existingIdx >= 0) {
                sysexQueue[existingIdx].color = color;
            } else {
                sysexQueue.push({ noteNumber, color });
            }
            if (!sysexQueueTimer) {
                sysexQueueTimer = setTimeout(flushSysexQueue, Math.max(12, 38 - elapsed));
            }
        }

        async function testOfficialSkooveColor(color) {
            if (feedbackTimer) {
                clearTimeout(feedbackTimer);
                feedbackTimer = null;
            }
            activeFeedback = null;
            if (!midiOutputs.length) {
                skipAutoSyncOnce = true;
                await initMIDI(false);
            }
            const currentStep = activeSequence[currentIndex] || activeSequence[0];
            const note = currentStep ? currentStep.note : 60;
            if (!color) {
                resetAllHardwareLeds();
                log(`🧹 SysEx RESET_ALL enviado: [F0 00 00 0E 00 4D 04 F7]`);
                return;
            }
            setKeyColor(note, color);
            const hexCode = color === 'orange' ? '0x17 (23=AMBER)' : color === 'green' ? '0x09 (9=GREEN)' : '0x01 (1=RED)';
            log(`✨ SysEx Skoove enviado a nota ${note}: [F0 00 00 0E 00 4D 00 ${note.toString(16).toUpperCase()} ${hexCode}]`);
        }

        let activeSequence = [
            { note: 60, name: 'C4 (Do)', lyric: 'Do4 - Dedo 1', finger: 1 },
            { note: 62, name: 'D4 (Re)', lyric: 'Re4 - Dedo 2', finger: 2 },
            { note: 64, name: 'E4 (Mi)', lyric: 'Mi4 - Dedo 3', finger: 3 },
            { note: 65, name: 'F4 (Fa)', lyric: 'Fa4 - Dedo 4', finger: 4 },
            { note: 67, name: 'G4 (Sol)', lyric: 'Sol4 - Dedo 5', finger: 5 }
        ];
        let currentIndex = 0;

        function log(msg) {
            const consoleEl = document.getElementById('logConsole');
            consoleEl.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function playPianoTone(midiNote) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = 440 * Math.pow(2, (midiNote - 69) / 12);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.7);
            } catch {}
        }

        async function toggleHorizontalMode() {
            const body = document.getElementById('appBody');
            const btn = document.getElementById('btnRotate');
            if (isForcedHorizontal || (window.innerWidth > window.innerHeight && document.fullscreenElement)) {
                isForcedHorizontal = false;
                body.classList.remove('forced-landscape');
                btn.innerText = '🔄 Horizontal';
                try {
                    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
                    if (document.fullscreenElement) await document.exitFullscreen();
                } catch {}
                return;
            }
            if (screen.orientation && screen.orientation.lock) {
                try {
                    if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                        await document.documentElement.requestFullscreen();
                    }
                    await screen.orientation.lock('landscape');
                    btn.innerText = '🔄 Vertical';
                    return;
                } catch {}
            }
            isForcedHorizontal = true;
            body.classList.add('forced-landscape');
            btn.innerText = '🔄 Vertical';
            setTimeout(() => updateLessonUI(), 100);
        }

        function parseXMLSequence(xmlText) {
            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(xmlText, "application/xml");
                const noteNodes = Array.from(doc.getElementsByTagName("note"));
                const stepMap = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
                const solfegeMap = { C: "Do", D: "Re", E: "Mi", F: "Fa", G: "Sol", A: "La", B: "Si" };
                const steps = [];

                for (const noteEl of noteNodes) {
                    if (noteEl.getElementsByTagName("rest").length > 0) continue;
                    const pitchEl = noteEl.getElementsByTagName("pitch")[0];
                    if (!pitchEl) continue;
                    const stepLetter = (pitchEl.getElementsByTagName("step")[0]?.textContent || "C").trim();
                    const octaveNum = parseInt(pitchEl.getElementsByTagName("octave")[0]?.textContent || "4", 10);
                    const alterNum = parseInt(pitchEl.getElementsByTagName("alter")[0]?.textContent || "0", 10);
                    const midiNote = (octaveNum + 1) * 12 + (stepMap[stepLetter] ?? 0) + alterNum;
                    const finger = parseInt(noteEl.getElementsByTagName("fingering")[0]?.textContent || "1", 10) || 1;
                    const acc = alterNum === 1 ? "#" : alterNum === -1 ? "b" : "";
                    const solfege = `${solfegeMap[stepLetter] || stepLetter}${acc}`;
                    steps.push({
                        note: midiNote,
                        name: `${stepLetter}${acc}${octaveNum} (${solfege})`,
                        lyric: `${solfege}${octaveNum} - Dedo ${finger}`,
                        finger
                    });
                }
                return steps;
            } catch {
                return [];
            }
        }

        async function uploadAndLoadXML(event) {
            const file = event.target.files[0];
            if (!file) return;

            log(`Procesando archivo: ${file.name}`);
            const reader = new FileReader();
            reader.onload = async function(e) {
                const xmlText = e.target.result;
                renderOSMD(xmlText);

                const parsedSteps = parseXMLSequence(xmlText);
                if (parsedSteps.length > 0) {
                    activeSequence = parsedSteps;
                    currentIndex = 0;
                    updateLessonUI();
                }

                try {
                    const fileName = `${Date.now()}_${file.name}`;
                    let publicUrl = `songs/${file.name}`;

                    const { data: uploadData, error: uploadError } = await supabaseClient.storage
                        .from('sheet-music')
                        .upload(fileName, file);

                    if (!uploadError && uploadData) {
                        const { data: publicUrlData } = supabaseClient.storage
                            .from('sheet-music')
                            .getPublicUrl(fileName);
                        if (publicUrlData?.publicUrl) {
                            publicUrl = publicUrlData.publicUrl;
                        }
                    }

                    const songId = `alesis-${Date.now()}`;
                    const { error: dbError } = await supabaseClient
                        .from('songs')
                        .insert([{
                            id: songId,
                            title: file.name,
                            artist: 'Partitura MusicXML',
                            album: 'Alesis Online Repertoire',
                            file_url: publicUrl,
                            xml_content: xmlText,
                            audio_url: publicUrl,
                            plain_lyrics: xmlText,
                            annotations: activeSequence
                        }]);

                    if (dbError) {
                        await supabaseClient.from('songs').upsert({
                            id: songId,
                            title: file.name,
                            artist: 'Partitura MusicXML',
                            album: 'Alesis Online Repertoire',
                            audio_url: publicUrl,
                            plain_lyrics: xmlText,
                            annotations: activeSequence,
                            updated_at: new Date().toISOString()
                        });
                    }

                    log(`¡Partitura subida y guardada en Supabase con éxito!`);
                    fetchCloudSongs();
                } catch (err) {
                    log(`Error al guardar en Supabase: ${err.message}`);
                }
            };
            reader.readAsText(file);
        }

        async function fetchCloudSongs() {
            try {
                const { data, error } = await supabaseClient
                    .from('songs')
                    .select('*')
                    .order('updated_at', { ascending: false });

                if (error) throw error;

                const selector = document.getElementById('cloudSongSelector');
                selector.innerHTML = '<option value="">Selecciona una partitura de la nube...</option>';
                
                data.forEach(song => {
                    const xmlContent = song.xml_content || song.plain_lyrics;
                    if (!xmlContent) return;
                    const opt = document.createElement('option');
                    opt.value = song.id;
                    opt.textContent = song.title;
                    opt.dataset.xml = xmlContent;
                    if (song.annotations) {
                        opt.dataset.sequence = JSON.stringify(song.annotations);
                    }
                    selector.appendChild(opt);
                });
                log(`Biblioteca cloud actualizada (${selector.options.length - 1} partituras).`);
            } catch (err) {
                log(`Error obteniendo canciones: ${err.message}`);
            }
        }

        async function loadSongFromCloud(songId) {
            if (!midiOutputs.length) {
                await initMIDI(false);
            }
            const selector = document.getElementById('cloudSongSelector');
            const selectedOption = selector.options[selector.selectedIndex];
            if (!selectedOption || !selectedOption.dataset.xml) return;

            const xmlText = selectedOption.dataset.xml;
            renderOSMD(xmlText);

            const parsed = selectedOption.dataset.sequence
                ? JSON.parse(selectedOption.dataset.sequence)
                : parseXMLSequence(xmlText);
            if (Array.isArray(parsed) && parsed.length > 0) {
                activeSequence = parsed;
                currentIndex = 0;
                updateLessonUI();
            }
            log(`Cargada partitura: ${selectedOption.textContent}`);
        }

        function updateLessonUI() {
            if (currentIndex >= activeSequence.length) {
                document.getElementById('songLyric').innerText = "¡Partitura completada! 🎉";
                document.getElementById('instructionText').innerText = "Toca cualquier tecla para reiniciar.";
                document.getElementById('fingerNumberBox').innerText = "✓";
                resetAllHardwareLeds();
                return;
            }
            const currentStep = activeSequence[currentIndex];
            document.getElementById('songLyric').innerText = currentStep.lyric;
            document.getElementById('instructionText').innerText = `Toca ${currentStep.name} (Luz Ámbar)`;
            document.getElementById('fingerNumberBox').innerText = currentStep.finger || 1;

            // Limpiar clases visuales en pantalla
            for (let i = 48; i <= 76; i++) {
                const keyEl = document.getElementById(`key-${i}`);
                if (keyEl) keyEl.classList.remove('led-red', 'led-green', 'led-orange');
            }

            // Apagar individualmente cualquier otra nota previa sin enviar RESET_ALL (0x04) para no cancelar el SET_LED siguiente
            const prevNotes = new Set([
                ...Array.from(hardwareLedState.keys()),
                ...Array.from(litHardwareNotes.keys())
            ]);
            prevNotes.forEach(prevNote => {
                if (prevNote !== currentStep.note) {
                    sendHardwareMidi(prevNote, null);
                }
            });

            setKeyColor(currentStep.note, 'orange');
        }

        async function renderOSMD(xmlString) {
            const container = document.getElementById("osmdContainer");
            container.innerHTML = "";
            osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay(container, {
                autoResize: true, backend: "svg", drawFingerings: true
            });
            await osmd.load(xmlString);
            await osmd.render();
            if (osmd.cursor) osmd.cursor.show();
        }

        async function initMIDI(silent = false) {
            if (!navigator.requestMIDIAccess) {
                if (!silent) alert("Web MIDI no soportado en este navegador.");
                return;
            }
            try {
                let midiAccess = null;
                try {
                    midiAccess = await navigator.requestMIDIAccess({ sysex: true });
                    sysexEnabled = true;
                } catch (sysexErr) {
                    midiAccess = await navigator.requestMIDIAccess({ sysex: false });
                    sysexEnabled = false;
                    if (!silent) {
                        log(`⚠️ Permiso SysEx bloqueado en Chrome. Habilita "Dispositivos MIDI (control completo)" en el ícono de ajustes junto a la URL para ver colores Naranja (0x17) y Verde (0x09).`);
                    }
                }
                const bindPorts = () => {
                    const allOuts = Array.from(midiAccess.outputs.values());
                    const filteredOuts = allOuts.filter(o => !(o.name || '').toLowerCase().includes('through'));
                    midiOutputs = filteredOuts.length > 0 ? filteredOuts : allOuts;

                    for (let out of midiOutputs) {
                        try { if (out.connection !== 'open' && out.open) out.open(); } catch {}
                    }
                    for (let input of midiAccess.inputs.values()) {
                        try { if (input.connection !== 'open' && input.open) input.open(); } catch {}
                        input.onmidimessage = handleMIDIMessage;
                    }
                    const isConn = midiOutputs.length > 0;
                    const wasConn = wasMidiConnected;
                    wasMidiConnected = isConn;
                    if (isConn && !wasConn) {
                        log(`✅ Alesis conectado (${midiOutputs.length} salidas, SysEx=${sysexEnabled ? 'ACTIVO 3 COLORES' : 'FALLBACK ROJO'}).`);
                        if (!skipAutoSyncOnce) {
                            updateLessonUI();
                        }
                        skipAutoSyncOnce = false;
                    }
                };
                bindPorts();
                midiAccess.onstatechange = () => bindPorts();
            } catch (err) {
                if (!silent) log(`Error MIDI: ${err.message}`);
            }
        }

        function setKeyColor(noteNumber, color) {
            const container = document.getElementById('virtualKeyboard');
            const keyEl = document.getElementById(`key-${noteNumber}`);
            if (keyEl) {
                keyEl.classList.remove('led-red', 'led-green', 'led-orange');
                if (color) {
                    keyEl.classList.add(`led-${color}`);
                    if (container) {
                        const targetLeft = keyEl.offsetLeft - (container.clientWidth / 2) + (keyEl.clientWidth / 2);
                        container.scrollTo({ left: Math.max(0, targetLeft), behavior: 'smooth' });
                    }
                }
            }
            sendHardwareMidi(noteNumber, color);
        }

        let activeFeedback = null;
        let feedbackTimer = null;

        function handleMIDIMessage(event) {
            const [status, note, velocity] = event.data;
            const cmd = status >> 4;
            if (cmd === 9 && velocity > 0) {
                evaluateUserNote(note);
            } else if (cmd === 8 || (cmd === 9 && velocity === 0)) {
                if (activeFeedback && activeFeedback.note === note) {
                    const fb = activeFeedback;
                    setTimeout(() => {
                        if (activeFeedback && activeFeedback.note === note) {
                            sendHardwareMidi(fb.note, fb.color);
                        }
                    }, 22);
                    return;
                }
                if (currentIndex < activeSequence.length) {
                    const targetNote = activeSequence[currentIndex].note;
                    if (note === targetNote) {
                        setTimeout(() => {
                            if (!activeFeedback) {
                                sendHardwareMidi(targetNote, 'orange');
                            }
                        }, 25);
                    }
                }
            }
        }

        function evaluateUserNote(playedNote) {
            playPianoTone(playedNote);
            if (currentIndex >= activeSequence.length) {
                currentIndex = 0;
                updateLessonUI();
                return;
            }
            const expectedNote = activeSequence[currentIndex].note;

            if (feedbackTimer) {
                clearTimeout(feedbackTimer);
                feedbackTimer = null;
            }

            if (playedNote === expectedNote) {
                activeFeedback = { note: expectedNote, color: 'green' };
                setKeyColor(expectedNote, 'green');
                currentIndex++;
                if (osmd && osmd.cursor) osmd.cursor.next();

                feedbackTimer = setTimeout(() => {
                    activeFeedback = null;
                    feedbackTimer = null;
                    setKeyColor(expectedNote, null);
                    updateLessonUI();
                }, 320);
            } else {
                activeFeedback = { note: playedNote, color: 'red' };
                setKeyColor(playedNote, 'red');
                feedbackTimer = setTimeout(() => {
                    activeFeedback = null;
                    feedbackTimer = null;
                    if (playedNote !== expectedNote) {
                        setKeyColor(playedNote, null);
                    }
                    setKeyColor(expectedNote, 'orange');
                }, 420);
            }
        }

        function buildVirtualKeyboard() {
            const container = document.getElementById('virtualKeyboard');
            for (let i = 48; i <= 76; i++) {
                const isBlack = [49, 51, 54, 56, 58, 61, 63, 66, 68, 70, 73, 75].includes(i);
                const key = document.createElement('div');
                key.id = `key-${i}`;
                key.className = isBlack 
                    ? 'key-black relative h-16 w-5 rounded-b-md cursor-pointer flex flex-col items-center justify-end pb-1.5 text-[7px] flex-shrink-0 transition-all' 
                    : 'key-white relative h-28 w-9 rounded-b-lg cursor-pointer flex flex-col items-center justify-end pb-1.5 text-[8px] font-bold shadow-sm flex-shrink-0 transition-all';
                if (isBlack) { key.style.marginLeft = "-10px"; key.style.marginRight = "-10px"; }
                key.innerHTML = `<span class="opacity-75 text-[7px]">${NOTE_LABELS[i]}</span><span>${SOLFEGE_LABELS[i]}</span>`;
                key.onclick = () => evaluateUserNote(i);
                container.appendChild(key);
            }
        }

        buildVirtualKeyboard();
        updateLessonUI();
        initMIDI(true);
        fetchCloudSongs();
    </script>
</body>
</html>
